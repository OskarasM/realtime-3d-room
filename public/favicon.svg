<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Explicit colours, not currentColor: an SVG used as a favicon has no
       inheriting page to take a colour from, so currentColor resolved to black
       and the mark disappeared on a dark browser tab. -->
  <rect width="64" height="64" fill="#070a10"/>
  <g transform="translate(32 32) scale(0.8) translate(-32 -32)">
    <!-- Two cores on one axis, the near one solid and the far one open: you,
         and everyone else, drawn a fixed distance behind you. The rule stops
         short of the open core so the gap stays legible at 16px. -->
    <path d="M 12 32 H 39" fill="none" stroke="#35e0f0" stroke-width="4"/>
    <circle cx="12" cy="32" r="8" fill="#35e0f0"/>
    <circle cx="52" cy="32" r="8" fill="none" stroke="#35e0f0" stroke-width="4"/>
  </g>
</svg>
