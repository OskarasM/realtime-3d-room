<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="realtime-3d-room">
  <title>realtime-3d-room</title>
  <!-- Two cores on one axis, the near one solid and the far one open: you, and
       everyone else, drawn a fixed distance behind you. The rule stops short of
       the open core so the gap between them stays legible at 24px. -->
  <path d="M 12 32 H 39" fill="none" stroke="currentColor" stroke-width="4"/>
  <circle cx="12" cy="32" r="8" fill="currentColor"/>
  <circle cx="52" cy="32" r="8" fill="none" stroke="currentColor" stroke-width="4"/>
</svg>
