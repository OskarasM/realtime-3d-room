name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - name: Prose is plain ASCII and British English
        run: node scripts/check-prose.mjs

      - name: Self-hosted type is within budget and licensed
        run: node scripts/check-font-budget.mjs

      - run: npm test

      - run: npm run build

  # Deliberately given no Supabase configuration. That is the state the deployed
  # site is in whenever the free project is paused, and every section below the
  # canvas has to read anyway, so it is the state worth testing. Pointing the
  # client at a placeholder host instead made it attempt a real request to a
  # domain that does not resolve, which WebKit reported as a page error.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium firefox webkit

      - run: npm run test:browser

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
