name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  # The build needs the variables to exist, not to be real. Nothing in CI talks
  # to Supabase, and no secret belongs in a client bundle anyway. Running the
  # browser tests against a deliberately unconfigured build is the point: that
  # is the state the deployed site is in whenever the free project is paused,
  # and every section has to read anyway.
  VITE_SUPABASE_URL: https://example.supabase.co
  VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - name: Prose is plain ASCII and British English
        run: node scripts/check-prose.mjs

      - name: Self-hosted type is within budget and licensed
        run: node scripts/check-font-budget.mjs

      - run: npm test

      - run: npm run build

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium firefox webkit

      - run: npm run test:browser

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
